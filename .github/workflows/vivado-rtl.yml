name: Vivado RTL regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

jobs:
  xsim:
    if: github.event_name == 'workflow_dispatch' || vars.VIVADO_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, vivado]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Run complete RTL and host regression
        run: python tools/run_video_tests.py --jobs 2
      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xsim-logs
          path: |
            out/tests/*/run.log
            out/tests/*/bench.json
          if-no-files-found: ignore
