[adapters.sim]
command = ["python3", "tools/video_flow.py", "sim"]
inputs = ["tools/video_flow.py", "tools/rtl_manifest.py", "tools/run_video_tests.py", "tools/run_video_tests.sh"]
outputs = ["build/fpga-flow/tests/**/run.log", "build/fpga-flow/tests/video-tests.log"]
success_markers = ["VIDEO_TESTS_PASS"]

[adapters.package]
command = ["python3", "tools/video_flow.py", "validate"]
inputs = ["tools/video_flow.py", "tools/package_all.tcl", "tools/package_ip.tcl", "tools/package_composite_ip.tcl", "tools/generate_package_metadata.py", "tools/validate_ip_catalog.tcl", "tools/synth_composite.tcl", "ip/video_pipeline_1_0/constraints/embedded_video_ip_clocks.xdc"]
outputs = ["build/fpga-flow/packages/ip_repo", "build/fpga-flow/ip_catalog_validation_feature_profile"]
success_markers = ["EMBEDDED_VIDEO_IP_CATALOG_PASS"]

[adapters.release]
command = ["python3", "tools/package_release.py", "--root", "{root}", "--output", "{out_dir}/artifacts/releases", "--vivado-version", "2025.2.1"]
inputs = ["tools/package_release.py", "VERSION", "LICENSES/**", "docs/ip-package-quickstart.md", "software/video_out.c", "software/video_out.h", "software/platforms/xilinx_zynq7000/**"]
outputs = ["build/fpga-flow/artifacts/releases/EmbeddedVideoIP-{package_version}-vivado-2025.2.1.zip", "build/fpga-flow/artifacts/releases/EmbeddedVideoIP-PS-Zynq7000-{package_version}.zip", "build/fpga-flow/artifacts/releases/SHA256SUMS"]
success_markers = ["EMBEDDED_VIDEO_IP_RELEASE_PASS"]

