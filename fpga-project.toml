schema_version = 1

[project]
id = "embedded-video-ip"
name = "EmbeddedVideoIP"
profile = "vivado-ip-package"

[tools]
vivado_version = "2025.2.1"

[ip_package]
component_xml = "ip_repo/panfpga/embedded_video_ip/component.xml"
version_file = "VERSION"
source_roots = ["ip/video_pipeline_1_0", "ip_repo/if", "software", "contracts", "LICENSES"]

[tests]
source_roots = ["tests"]
default_success_markers = ["TEST_PASS:"]

[tests.suite_stages]
default = "sim"

[build]
output_dir = "build/fpga-flow"

